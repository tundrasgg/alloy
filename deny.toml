# The dependency allowlist. Rules: agent/eng/deps.md.
#
# A crate builds in CI only if it is listed in `bans.allow` below. Adding one is a
# class N decision with a research note, made by the lead in the task that needs it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The licenses compatible with MIT OR Apache-2.0 that agent/eng/deps.md accepts.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is policy, not an inventory: a license nothing uses yet stays allowed.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Duplicate versions allowed despite `multiple-versions`. Each is compile-time
# only and named with its exact version.
skip = [
    { crate = "block-buffer@0.10.4", reason = "under sha2 0.10, which quorum-set in the openraft tree uses; alloy-crypto uses the 0.12 generation" },
    { crate = "cpufeatures@0.2.17", reason = "under sha2 0.10 in the openraft tree; alloy-crypto's tree uses 0.3" },
    { crate = "crypto-common@0.1.7", reason = "under sha2 0.10 in the openraft tree; alloy-crypto's tree uses 0.2" },
    { crate = "digest@0.10.7", reason = "under sha2 0.10 in the openraft tree; alloy-crypto's tree uses 0.11" },
    { crate = "rand@0.8.8", reason = "build dependency only: phf_generator, in the chrono-tz build tree of openraft" },
    { crate = "rand_core@0.6.4", reason = "build dependency only: rand 0.8, in the chrono-tz build tree of openraft" },
    { crate = "syn@2.0.119", reason = "proc macro parser used only to build curve25519-dalek-derive on x86_64; thiserror-impl uses syn 3, and no curve25519-dalek release uses syn 3" },
]
# The allowlist. Every crate in the graph, workspace members included, must be
# named here. Nothing else builds.
