    { crate = "prost", reason = "standing choice for Protocol Buffers (agent/eng/deps.md), used by alloy-id for node records and stored data" },
    { crate = "prost-derive", reason = "prost dependency: its derive macro" },
    { crate = "quinn-udp", reason = "batched UDP I/O with segmentation offload for the `os` net seam in alloy-rt (ARFC 0005 clause 3.1.2)" },
    { crate = "quote", reason = "thiserror-impl and curve25519-dalek-derive dependency" },
    { crate = "r-efi", reason = "getrandom dependency on UEFI targets, in the proptest tree" },
    { crate = "rand", reason = "proptest dependency" },
    { crate = "rand_core", reason = "rand dependency in the proptest tree; also a chacha20 and x25519-dalek dependency, through which alloy-crypto draws no randomness" },
    { crate = "rand_xorshift", reason = "proptest dependency" },
    { crate = "rcgen", reason = "X.509 certificates for the API CA and API server, default features off (agent/eng/crypto.md, ADR 0053), used only by alloy-crypto" },
    { crate = "regex-syntax", reason = "proptest dependency" },
    { crate = "rfc6979", reason = "ecdsa dependency: deterministic ECDSA nonces (agent/eng/crypto.md, ADR 0053)" },
    { crate = "rustc_version", reason = "build dependency of curve25519-dalek" },
    { crate = "rustls-pki-types", reason = "rcgen dependency: the certificate DER type" },
    { crate = "sec1", reason = "elliptic-curve dependency: SEC1 point encoding" },
    { crate = "semver", reason = "rustc_version dependency, in the curve25519-dalek build tree" },
    { crate = "sha2", reason = "SHA-256 for P-256 signatures and RFC 7093 key identifiers, used only by alloy-crypto; also an ed25519-dalek dependency" },
    { crate = "shlex", reason = "cc dependency, in the blake3 build tree" },
    { crate = "signal-hook-registry", reason = "tokio dependency under its `signal` feature, which alloyd uses for SIGTERM and SIGINT on Unix platforms" },
    { crate = "signature", reason = "ecdsa and ed25519 dependency: the signing traits" },
    { crate = "socket2", reason = "socket options of the `os` net seam in alloy-rt; also a tokio and quinn-udp dependency" },
    { crate = "spki", reason = "ecdsa and pkcs8 dependency: SubjectPublicKeyInfo encoding" },
    { crate = "subtle", reason = "constant time comparison (agent/eng/crypto.md rule 3), used by alloy-crypto and curve25519-dalek" },
    { crate = "syn", reason = "thiserror-impl dependency (version 3) and curve25519-dalek-derive dependency (version 2, see `skip`)" },
    { crate = "thiserror", reason = "standing choice for library error types (agent/eng/deps.md)" },
    { crate = "thiserror-impl", reason = "thiserror dependency: its derive macro" },
    { crate = "time", reason = "rcgen dependency: certificate validity times; also used by alloy-id for the API CA validity" },
    { crate = "time-core", reason = "time dependency" },
    { crate = "tokio", reason = "standing choice for the async runtime of the `os` seams in alloy-rt (agent/eng/deps.md)" },
    { crate = "tracing", reason = "standing choice for logging (agent/eng/deps.md), used by alloyd" },
    { crate = "tracing-core", reason = "tracing dependency: the subscriber interface" },
    { crate = "typenum", reason = "hybrid-array dependency" },
    { crate = "unarray", reason = "proptest dependency" },
    { crate = "unicode-ident", reason = "proc-macro2 and syn dependency, in the thiserror and curve25519-dalek-derive trees" },
