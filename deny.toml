    { crate = "windows-sys", reason = "Windows interface enumeration of the `os` net seam in alloy-rt; also a mio, quinn-udp, socket2, and tokio dependency" },
    { crate = "windows-service", reason = "the Windows service control manager interface of alloyd (ARFC 0017 clause 3.15 step 7), on Windows only" },
    { crate = "wnaf", reason = "group and primeorder dependency: windowed scalar multiplication" },
    { crate = "x25519-dalek", reason = "X25519, the AL key agreement (agent/eng/crypto.md), used only by alloy-crypto" },
    { crate = "xtask", reason = "workspace member: repository automation" },
    { crate = "yasna", reason = "rcgen dependency: its DER writer" },
    { crate = "zeroize", reason = "erasure of key material on drop (agent/eng/crypto.md rule 3)" },
