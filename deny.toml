    { crate = "aws-lc-sys", reason = "aws-lc-rs dependency: the AWS-LC C library it builds; every license in its expression is on the list" },
    { crate = "base16ct", reason = "sec1 and elliptic-curve dependency: constant time hexadecimal" },
    { crate = "base64", reason = "tonic dependency: binary metadata encoding" },
    { crate = "bitflags", reason = "proptest dependency" },
