# The dependency allowlist. Rules: agent/eng/deps.md.
#
# A crate builds in CI only if it is listed in `bans.allow` below. Adding one is a
# class N decision with a research note, made by the lead in the task that needs it.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The licenses compatible with MIT OR Apache-2.0 that agent/eng/deps.md accepts.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The list is policy, not an inventory: a license nothing uses yet stays allowed.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Duplicate versions allowed despite `multiple-versions`. Each is compile-time
# only and named with its exact version.
skip = [
    { crate = "syn@2.0.119", reason = "proc macro parser used only to build curve25519-dalek-derive on x86_64; thiserror-impl uses syn 3, and no curve25519-dalek release uses syn 3" },
]
# The allowlist. Every crate in the graph, workspace members included, must be
# named here. Nothing else builds.
allow = [
    { crate = "aead", reason = "chacha20poly1305 dependency: the AEAD traits" },
    { crate = "alloy-crypto", reason = "workspace member: the only crate with cryptographic dependencies (agent/eng/crypto.md)" },
    { crate = "alloy-rt", reason = "workspace member: runtime seams (ARFC 0005)" },
    { crate = "alloy-seam", reason = "workspace member: seam registry (ARFC 0001)" },
    { crate = "alloy-sim", reason = "workspace member: deterministic simulator (ARFC 0005)" },
    { crate = "alloy-wire", reason = "workspace member: AL message codec (ARFC 0003)" },
    { crate = "arrayvec", reason = "blake3 dependency" },
    { crate = "autocfg", reason = "build dependency of num-traits, in the proptest tree" },
    { crate = "bitflags", reason = "proptest dependency" },
    { crate = "blake2", reason = "BLAKE2s for the AL handshake, MACs and HMAC (agent/eng/crypto.md), used only by alloy-crypto" },
    { crate = "blake3", reason = "content hashing (agent/eng/crypto.md), used only by alloy-crypto; licensed under its Apache-2.0 option" },
    { crate = "block-buffer", reason = "digest and cipher dependency" },
    { crate = "cc", reason = "build dependency of blake3; compiles nothing with the `pure` feature" },
    { crate = "cfg-if", reason = "blake3, chacha20, curve25519-dalek and getrandom dependency" },
    { crate = "chacha20", reason = "chacha20poly1305 dependency (AL AEAD, agent/eng/crypto.md), also in the proptest tree" },
    { crate = "chacha20poly1305", reason = "XChaCha20-Poly1305, the AL AEAD (agent/eng/crypto.md), used only by alloy-crypto" },
    { crate = "cipher", reason = "chacha20 and chacha20poly1305 dependency" },
    { crate = "cmov", reason = "ctutils dependency: constant time selection" },
    { crate = "conformance-rt", reason = "workspace member: runtime seam conformance suites (ARFC 0005)" },
    { crate = "conformance-wire", reason = "workspace member: conformance vectors for alloy-wire (ARFC 0003)" },
    { crate = "constant_time_eq", reason = "blake3 dependency; licensed under its Apache-2.0 option" },
    { crate = "core_detect", reason = "proptest dependency" },
    { crate = "cpufeatures", reason = "blake3, chacha20, poly1305 and curve25519-dalek dependency" },
    { crate = "crypto-common", reason = "digest, aead and cipher dependency" },
    { crate = "ctutils", reason = "digest and universal-hash dependency: constant time comparison" },
    { crate = "curve25519-dalek", reason = "x25519-dalek dependency: the curve arithmetic" },
    { crate = "curve25519-dalek-derive", reason = "curve25519-dalek dependency on x86_64: its SIMD backend macros; licensed under its MIT option" },
    { crate = "digest", reason = "blake2 dependency: the hash traits" },
    { crate = "fiat-crypto", reason = "curve25519-dalek dependency only when built with the `fiat` backend cfg, which Alloy does not set; licensed under its MIT or Apache-2.0 option" },
    { crate = "find-msvc-tools", reason = "cc dependency, in the blake3 build tree" },
    { crate = "getrandom", reason = "rand dependency, in the proptest tree" },
    { crate = "hkdf", reason = "alloy-crypto dev-dependency only: an independent HKDF the crate tests its own against" },
    { crate = "hmac", reason = "alloy-crypto dev-dependency only, and hkdf dependency: an independent HMAC the crate tests its own against" },
    { crate = "hybrid-array", reason = "digest, crypto-common and inout dependency" },
    { crate = "inout", reason = "aead and cipher dependency" },
    { crate = "libc", reason = "cpufeatures and getrandom dependency" },
    { crate = "num-traits", reason = "proptest dependency" },
    { crate = "poly1305", reason = "chacha20poly1305 dependency" },
    { crate = "proc-macro2", reason = "thiserror-impl and curve25519-dalek-derive dependency" },
    { crate = "proptest", reason = "standing choice for property tests (agent/eng/deps.md)" },
    { crate = "quote", reason = "thiserror-impl and curve25519-dalek-derive dependency" },
    { crate = "r-efi", reason = "getrandom dependency on UEFI targets, in the proptest tree" },
    { crate = "rand", reason = "proptest dependency" },
    { crate = "rand_core", reason = "rand dependency in the proptest tree; also a chacha20 and x25519-dalek dependency, through which alloy-crypto draws no randomness" },
    { crate = "rand_xorshift", reason = "proptest dependency" },
    { crate = "regex-syntax", reason = "proptest dependency" },
    { crate = "rustc_version", reason = "build dependency of curve25519-dalek" },
    { crate = "semver", reason = "rustc_version dependency, in the curve25519-dalek build tree" },
    { crate = "shlex", reason = "cc dependency, in the blake3 build tree" },
    { crate = "subtle", reason = "constant time comparison (agent/eng/crypto.md rule 3), used by alloy-crypto and curve25519-dalek" },
    { crate = "syn", reason = "thiserror-impl dependency (version 3) and curve25519-dalek-derive dependency (version 2, see `skip`)" },
    { crate = "thiserror", reason = "standing choice for library error types (agent/eng/deps.md)" },
    { crate = "thiserror-impl", reason = "thiserror dependency: its derive macro" },
    { crate = "typenum", reason = "hybrid-array dependency" },
    { crate = "unarray", reason = "proptest dependency" },
    { crate = "unicode-ident", reason = "proc-macro2 and syn dependency, in the thiserror and curve25519-dalek-derive trees" },
    { crate = "universal-hash", reason = "poly1305 dependency" },
    { crate = "x25519-dalek", reason = "X25519, the AL key agreement (agent/eng/crypto.md), used only by alloy-crypto" },
    { crate = "xtask", reason = "workspace member: repository automation" },
    { crate = "zeroize", reason = "erasure of key material on drop (agent/eng/crypto.md rule 3)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
