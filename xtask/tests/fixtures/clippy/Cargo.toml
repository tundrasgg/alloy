# The Clippy fixture for the `direct-io` ban, a workspace of its own: the test in
# `xtask/src/clippy_fixture.rs` runs Clippy over it with the repository's
# `clippy.toml`. It is not a member of the repository workspace and nothing in
# the repository depends on it.
#
# Its dependencies are the local stand-ins under `stand-in/`, one for each
# third-party crate whose paths `clippy.toml` names. Each holds those paths at
# the places the real crate, at the version its manifest names, holds them, and
# nothing that reaches the operating system. So the fixture builds nothing from
# outside the repository, and Cargo fetches nothing.

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["stand-in"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rand = { path = "stand-in/rand" }
tokio = { path = "stand-in/tokio" }
