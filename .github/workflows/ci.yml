# The quality gate. This workflow only prepares a machine and runs
# `cargo xtask ci` (ADR 0037). New checks go into xtask, never into this file.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Each push to main gets a
# group of its own, keyed by commit SHA, so no newer run can cancel it, pending
# or in progress, and every commit on main gets a verdict.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The path lock in `check-repo` diffs against the merge base with the
        # base ref, and the commit check walks back to the commit before the
        # push or to 5429bb9, so the whole history and every branch are
        # fetched.
        with:
          persist-credentials: false
          fetch-depth: 0

      # rustup reads rust-toolchain.toml and installs that toolchain with its
      # profile and components. The runner image's rustup is used as is.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo skips the build when this exact version is already in the cached
      # ~/.cargo/bin.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # `--base` turns on the path lock in `check-repo`. A pull request is
      # judged against its base branch; its checkout is a detached merge
      # commit, so the head branch is named. A push to main is judged against
      # the commit before it, and the branch is named so the verdict does not
      # depend on how the checkout left HEAD. A push with no previous commit
      # has nothing to diff.
      #
      # `--commits` makes the last step check the message of every commit a
      # push to main adds, against `agent/eng/git.md` and the path lock
      # (D-0016). Pull requests skip it: task branch commits are free-form and
      # disappear in the squash. When the commit before the push is all zeros
      # or not an ancestor of the commit after it, xtask starts the range at
      # 5429bb9 instead (D-0037).
      #
      # Event values reach the shell only through the environment, never
      # through expressions in the script.
      - name: Run the quality gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              options=(--base "origin/$GITHUB_BASE_REF" --branch "$GITHUB_HEAD_REF")
              ;;
            push)
              options=(--commits "$BEFORE..$GITHUB_SHA")
              if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                options+=(--base "$BEFORE" --branch "$GITHUB_REF_NAME")
              fi
              ;;
            *)
              echo "ci: unexpected event $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          cargo xtask ci "${options[@]}"
