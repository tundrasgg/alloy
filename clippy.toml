    { path = "std::time::Instant::now", reason = "the clock: use the `alloy-rt` clock" },
    { path = "std::time::SystemTime::now", reason = "the clock: use the `alloy-rt` clock" },
    { path = "std::thread::sleep", reason = "the clock: use the `alloy-rt` clock" },
    { path = "tokio::time::Instant::now", reason = "the clock: use the `alloy-rt` clock", allow-invalid = true },
    { path = "tokio::time::sleep", reason = "the clock: use the `alloy-rt` clock", allow-invalid = true },
