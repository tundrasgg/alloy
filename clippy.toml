# Clippy configuration for the whole workspace.
#
# The `direct-io` ban (ARFC 0005 clause 3.1.1, `agent/eng/rust.md` rule 2, D-0017):
# only `alloy-rt` and `alloy-sim` call the operating system for time, network,
# storage, randomness, or concurrency. Every other crate goes through the
# `alloy-rt` traits. Clippy resolves each path below to the item it names, so a
# grouped, renamed, or glob import, or a call that a macro generates, is caught
# as surely as a call written out in full. `cargo xtask ci` runs Clippy with
# `-D clippy::disallowed_methods -D clippy::disallowed_types`.
#
# `alloy-rt` and `alloy-sim` opt out with a crate-level
# `#![allow(clippy::disallowed_methods, clippy::disallowed_types, reason = "...")]`.
# `cargo xtask check-repo` rejects that `allow`, or any other way to switch these
# lints off in source, in every other crate under `crates/`, and rejects any
# Clippy configuration file other than this one.
#
# `allow-invalid = true` marks a path that does not resolve in every crate: one
# from a crate that a crate need not depend on, from one version of a crate, or
# from one platform. Without it, Clippy warns in each such crate. The fixture
# test in `xtask/src/clippy_fixture.rs` checks that every path resolves where
# its crate is present.

disallowed-methods = [
