[workspace]
resolver = "3"
members = [
    "crates/alloy",
    "crates/alloy-api",
    "crates/alloy-crypto",
    "crates/alloy-id",
    "crates/alloy-link",
    "crates/alloy-proto",
    "crates/alloy-rt",
    "crates/alloy-seam",
    "crates/alloy-sim",
    "crates/alloy-state",
    "crates/alloy-wire",
    "crates/alloyd",
    "tests/conformance/log-store",
    "tests/conformance/rt",
    "tests/conformance/state-store",
    "tests/conformance/wire",
    "xtask",
]
# The fuzz targets are their own workspace: they build only under `cargo fuzz`.
exclude = ["fuzz"]

[workspace.package]
# The release version that `alloy version` and `alloyd version` print (ARFC
# 0017 clause 3.13). The release workflow sets it from the tag.
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

# Crates inherit these with `<name> = { workspace = true }`. The trees behind
# them are on the `deny.toml` allowlist.
[workspace.dependencies]
# The AL handshake and transport primitives (ARFC 0003, agent/eng/crypto.md).
# Only alloy-crypto depends on these. Every one is built with its `zeroize`
# feature, so key material the crates hold is erased on drop (ARFC 0003
# section 3.3). No feature that reads a random generator is enabled: the caller
# supplies every random byte.
blake2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Only alloy-crypto depends on this (agent/eng/crypto.md rule 1). `pure` selects
# the Rust implementations, so the build compiles no C or assembly. `std` keeps
# runtime CPU feature detection for the Rust SIMD paths.
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
# The native API (ARFC 0008 clause 3.10): Protocol Buffers by `prost`, gRPC by
# `tonic`, served and called over `hyper`'s HTTP/2 on connections that
# alloy-api makes through the `alloy-rt` net seam. `tonic` has only `codegen`:
# its transport would open sockets and spawn tasks outside `alloy-rt`.
bytes = "=1.11.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
# Stream combinators for the openraft storage adapters in alloy-state; already
# in the openraft tree.
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# Only alloy-rt depends on the crates below. They serve its `os` runtime
# implementations (ARFC 0005 section 2.6), the only code outside alloy-sim that
# calls the operating system for time, network, storage, randomness, or
# concurrency.
#
# The platform's cryptographically secure generator, for the `os` rng seam.
getrandom = "=0.4.3"
# Dev-dependencies of alloy-crypto only: independent implementations of
# HMAC-BLAKE2s and HKDF that its own construction is tested against.
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http2", "server"] }
# System calls and option constants of Unix platforms.
libc = "=0.2.191"
# Raft for the control plane groups (ADR 0064), used only by alloy-state. The
# default features add the tokio runtime and clap; alloy-state runs openraft on
# its own `AsyncRuntime` over `alloy-rt` instead.
openraft = { version = "=0.10.0", default-features = false }
# Dev-dependency only. The default `fork` and `timeout` features run each test
# in a child process under a wall clock timeout, and agent/eng/testing.md bars
# wall clock reads in tests, so only `std` is enabled.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
prost = { version = "=0.14.6", default-features = false, features = ["std", "derive"] }
prost-types = { version = "=0.14.6", default-features = false, features = ["std"] }
# Build dependencies of alloy-proto: `protox` compiles the definitions in Rust,
# so the build needs neither `protoc` nor the network.
protox = "=0.10.0"
# Batched UDP send and receive with segmentation offload, packet information,
# and the don't fragment options (ARFC 0005 clause 3.1.2). Its default features
# only add logging.
quinn-udp = { version = "=0.5.16", default-features = false }
# The generator trait openraft's runtime draws election timeouts through;
# alloy-state implements it over the `alloy-rt` rng seam.
rand_core = { version = "=0.10.1", default-features = false }
# Dev-dependency of alloy-api only: test certificates for its TLS tests. With
# `aws_lc_rs` it signs with the provider's own randomized signer, which is
# allowed only for these throwaway test keys, never an Alloy key
# (agent/eng/crypto.md).
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "crypto"] }
# The `native` log-store and state-store files (ADR 0064, ARFC 0006 section
# 4.2), used only by alloy-state.
redb = { version = "=4.5.0", default-features = false, features = ["std"] }
# TLS 1.3 for the API endpoints (agent/eng/crypto.md, ADR 0042, ADR 0053),
# used only by alloy-api. Only the `aws-lc-rs` provider and `std`: no TLS 1.2,
# no logging, and the key exchange groups are set by alloy-api.
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
# Socket creation and options before a socket is handed to tokio.
socket2 = { version = "=0.6.5", features = ["all"] }
subtle = { version = "=2.6.1", default-features = false }
thiserror = "=2.0.21"
# The standing async runtime (agent/eng/deps.md). No macros: the multi-thread
# scheduler, timers, sockets, and `Notify` only. `alloyd` also uses it, with the
# `signal` feature added, to watch the stop signals of its process, which no
# runtime seam carries.
tokio = { version = "=1.54.1", default-features = false, features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
tonic = { version = "=0.14.9", default-features = false, features = ["codegen"] }
tonic-prost = { version = "=0.14.9", default-features = false }
tonic-prost-build = { version = "=0.14.9", default-features = false }
tower-service = "=0.3.3"
# The standing choice for logging (agent/eng/deps.md), used by `alloyd`. The
# `attributes` feature, a procedural macro tree, is off.
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
# The certificate parser `rustls` verifies with, named directly by alloy-api to
# read the SubjectPublicKeyInfo of a presented CA certificate for `api_ca_fp`
# (ARFC 0002 section 3.7).
webpki = { package = "rustls-webpki", version = "=0.103.17", default-features = false, features = ["alloc"] }
# The Windows service control manager interface of `alloyd` (ARFC 0017 clause
# 3.15 step 7), on Windows only.
windows-service = "=0.8.1"
# Interface enumeration, a write handle for `sync` on a read handle, and the
# security descriptors of `create_file`, `create_dir_protected`, and `security`, on
# Windows.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage", "Win32_Storage_FileSystem"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "=1.9.1", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
